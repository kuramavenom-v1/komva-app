<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komva - Messenger</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/chat.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Bottom Floating Navigation Bar (مطابق للصورة) */
        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #161b22;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px;
            border-radius: 40px;
            width: 92%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 0.75rem;
            gap: 4px;
            transition: 0.2s;
        }

        .nav-item.active {
            color: #58a6ff;
        }

        .nav-item.active .nav-icon-bg {
            background-color: #1f6feb;
            color: #fff;
        }

        .nav-icon-bg {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            position: relative;
            background-color: #21262d;
            color: #c9d1d9;
        }

        .nav-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background-color: #2f81f7;
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* App Views Container */
        .app-view {
            display: none;
            height: calc(100vh - 85px);
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .app-view.active-view {
            display: block;
        }

        /* Profile View Styling (مطابق للصورة الثانية تماماً) */
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-header-center {
            text-align: center;
            padding: 15px 0;
        }
        .profile-main-avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #30363d;
            margin-bottom: 10px;
        }
        .profile-actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .profile-action-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #ffffff;
            padding: 12px 8px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .profile-action-card:hover {
            background-color: #21262d;
        }
        
        .info-card-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 15px;
        }
        .info-row {
            margin-bottom: 16px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-data {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            direction: ltr;
            text-align: right;
        }
        .info-title {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة المحادثات -->
    <div id="view-chats" class="app-view active-view">
        <div style="padding: 20px;">
            <h2>المحادثات</h2>
            <div style="margin: 15px 0;">
                <input type="text" placeholder="بحث..." style="width:100%; padding:12px; border-radius:15px; background:#161b22; border:1px solid #30363d; color:#fff; outline:none;">
            </div>
            <div id="conversations-container">
                <!-- محادثات تجريبية -->
                <div style="background:#161b22; padding:12px; border-radius:12px; border:1px solid #30363d; display:flex; align-items:center; gap:12px; cursor:pointer;">
                    <img src="https://i.pravatar.cc/150?img=1" style="width:45px; height:45px; border-radius:50%; object-fit:cover;">
                    <div style="flex:1;">
                        <h4 style="margin:0; font-size:0.95rem;">Ahmed Ali</h4>
                        <p style="margin:4px 0 0 0; font-size:0.8rem; color:#8b949e;">Hey, how are you?</p>
                    </div>
                    <span style="font-size:0.75rem; color:#8b949e;">8:42 PM</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. شاشة جهات الاتصال -->
    <div id="view-contacts" class="app-view">
        <div style="padding: 20px;">
            <h2>جهات الاتصال</h2>
            <p style="color: #8b949e; margin-top: 10px;">قريباً يتم عرض جهات الاتصال هنا.</p>
        </div>
    </div>

    <!-- 3. شاشة الإعدادات -->
    <div id="view-settings" class="app-view">
        <div style="padding: 20px; max-width: 600px; margin: 0 auto;">
            <h2>الإعدادات</h2>
            <div style="background:#161b22; border:1px solid #30363d; border-radius:16px; padding:20px; margin-top:20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <span>الوضع الليلي</span>
                    <input type="checkbox" checked style="width:18px; height:18px; cursor:pointer;">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>إشعارات سطح المكتب</span>
                    <input type="checkbox" checked style="width:18px; height:18px; cursor:pointer;">
                </div>
            </div>
            <button onclick="logout()" style="width:100%; background:#da3633; color:white; padding:12px; border-radius:12px; border:none; margin-top:20px; font-weight:bold; cursor:pointer;">تسجيل الخروج</button>
        </div>
    </div>

    <!-- 4. شاشة الملف الشخصي (مطابقة للصورة الثانية تماماً) -->
    <div id="view-profile" class="app-view">
        <div class="profile-container">
            <div class="profile-header-center">
                <img src="https://i.pravatar.cc/150?img=8" class="profile-main-avatar">
                <h2 style="font-size: 1.3rem; font-weight: 700; margin: 5px 0;">Devil's Venom</h2>
                <span style="font-size: 0.8rem; color: #3fb950;">متصل</span>
            </div>

            <div class="profile-actions-grid">
                <button class="profile-action-card">
                    <span style="font-size: 1.2rem;">📷</span>
                    <span>تعيين صورة</span>
                </button>
                <button class="profile-action-card">
                    <span style="font-size: 1.2rem;">✏️</span>
                    <span>تعديل البيانات</span>
                </button>
                <button class="profile-action-card" onclick="switchTab('view-settings', document.querySelectorAll('.nav-item')[2])">
                    <span style="font-size: 1.2rem;">⚙️</span>
                    <span>الإعدادات</span>
                </button>
            </div>

            <div class="info-card-box">
                <div class="info-row">
                    <div class="info-data">+20 112 0207758</div>
                    <div class="info-title">جوال</div>
                </div>
                <div class="info-row">
                    <div class="info-data" style="direction: rtl; text-align: right;">Devil's Warth — Be the leader, not the follower, or you will be disres</div>
                    <div class="info-title">النبذة</div>
                </div>
                <div class="info-row">
                    <div class="info-data">@V_K_U1</div>
                    <div class="info-title">اسم المستخدم</div>
                </div>
            </div>
        </div>
    </div>

    <!-- القائمة السفلية العائمة المطابقة لصورتك تماماً بالترتيب -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('view-chats', this)">
            <div class="nav-icon-bg">
                💬
                <span class="nav-badge">138</span>
            </div>
            <span>المحادثات</span>
        </button>
        <button class="nav-item" onclick="switchTab('view-contacts', this)">
            <div class="nav-icon-bg">👤</div>
            <span>جهات الاتصال</span>
        </button>
        <button class="nav-item" onclick="switchTab('view-settings', this)">
            <div class="nav-icon-bg">⚙️</div>
            <span>الإعدادات</span>
        </button>
        <button class="nav-item" onclick="switchTab('view-profile', this)">
            <div class="nav-icon-bg" style="padding:0; overflow:hidden;">
                <img src="https://i.pravatar.cc/150?img=8" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <span>الملف الشخصي</span>
        </button>
    </nav>

    <script src="js/storage.js"></script>
    <script>
        function switchTab(viewId, btnElement) {
            document.querySelectorAll('.app-view').forEach(view => {
                view.classList.remove('active-view');
            });
            document.getElementById(viewId).classList.add('active-view');

            if (btnElement) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                });
                btnElement.classList.add('active');
            }
        }

        function logout() {
            Storage.clearSession();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
