<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Komva</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h2>komva</h2>
            <p>Enter your email to receive a password reset link.</p>
        </div>
        
        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <button type="submit" class="btn-primary btn-full">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <p><a href="login.html">← Back to Sign In</a></p>
        </div>
    </div>
    <!-- 1. استدعاء ملف الـ JavaScript الذي يحتوي على الدوال (تأكد أن مساره صحيح حسب مجلداتك) -->
<script src="js/auth-api.js"></script>

<!-- 2. ربط الـ Form الفعلي بالدالة البرمجية -->
<script>
    document.getElementById('login-form').addEventListener('submit', handleLogin); // لصفحة الدخول
    // أو
    document.getElementById('signup-form').addEventListener('submit', handleSignup); // لصفحة التسجيل
</script>
</body>
</html>
