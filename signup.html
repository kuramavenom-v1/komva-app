<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Komva</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #00bcd4; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00bcd4; border: none; color: #121212; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0097a7; }
        p { text-align: center; margin-top: 15px; font-size: 14px; }
        a { color: #00bcd4; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2>إنشاء حساب جديد</h2>
        <form id="signup-form">
            <input type="text" id="name" placeholder="الاسم الكامل" required>
            <input type="text" id="username" placeholder="اسم المستخدم (مثل: vkr)" required>
            <input type="text" id="phoneOrEmail" placeholder="البريد الإلكتروني أو رقم الجوال" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">إتمام التسجيل</button>
        </form>
        <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
    </div>

    <!-- سطر ربط ملف الـ API -->
    <script src="js/auth-api.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', handleSignup);
    </script>
    <!-- 1. استدعاء ملف الـ JavaScript الذي يحتوي على الدوال (تأكد أن مساره صحيح حسب مجلداتك) -->
<script src="js/auth-api.js"></script>

<!-- 2. ربط الـ Form الفعلي بالدالة البرمجية -->
<script>
    document.getElementById('login-form').addEventListener('submit', handleLogin); // لصفحة الدخول
    // أو
    document.getElementById('signup-form').addEventListener('submit', handleSignup); // لصفحة التسجيل
</script>
</body>
</html>
