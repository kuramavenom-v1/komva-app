<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komva - Modern Messaging Platform</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="manifest" href="manifest.json">
    <style>
        /* تنسيقات إضافية خاصة بالصفحة الرئيسية لضمان ظهورها بشكل رهيب */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .hero-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 40px;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            gap: 40px;
        }
        .hero-content {
            max-width: 600px;
        }
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        .hero-content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .hero-actions {
            display: flex;
            gap: 15px;
        }
        .hero-mockup {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            min-width: 300px;
        }
        .btn-primary {
            background-color: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
        }
        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            display: inline-block;
        }
        @media (max-width: 768px) {
            .hero-section {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
            }
            .hero-content h1 {
                font-size: 2.2rem;
            }
            .hero-actions {
                justify-content: center;
            }
            .navbar {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">komva</div>
        <nav class="nav-links">
            <a href="login.html" class="btn-secondary" style="padding: 8px 16px;">Sign In</a>
            <a href="signup.html" class="btn-primary" style="padding: 8px 16px;">Get Started</a>
        </nav>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1>Connect instantly with anyone, anywhere.</h1>
            <p>Komva is a secure, modern, and lightning-fast individual messaging platform designed for seamless communication.</p>
            <div class="hero-actions">
                <a href="signup.html" class="btn-primary">Start Now</a>
                <button id="theme-toggle" class="btn-secondary">Toggle Theme</button>
            </div>
        </div>
        <div class="hero-mockup">
            <p style="font-size: 1.2rem; margin-bottom: 10px;">💬 <strong>Komva Chat</strong></p>
            <span style="color: var(--text-secondary);">Fast, clean, and reliable.</span>
        </div>
    </main>

    <script src="js/app.js"></script>
    <!-- 1. استدعاء ملف الـ JavaScript الذي يحتوي على الدوال (تأكد أن مساره صحيح حسب مجلداتك) -->
<script src="js/auth-api.js"></script>

<!-- 2. ربط الـ Form الفعلي بالدالة البرمجية -->
<script>
    document.getElementById('login-form').addEventListener('submit', handleLogin); // لصفحة الدخول
    // أو
    document.getElementById('signup-form').addEventListener('submit', handleSignup); // لصفحة التسجيل
</script>
</body>
</html>
